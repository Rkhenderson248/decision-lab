name: Keep demo app awake

# Visits the live app every few hours so visitors never meet the sleep screen,
# and warms the slow pages' caches. Set a repository variable APP_URL to
# override the address.

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Visit the app
        env:
          APP_URL: ${{ vars.APP_URL || 'https://richardhenderson-lab.streamlit.app' }}
        run: python scripts/keep_awake.py
