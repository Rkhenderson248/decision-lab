name: Link check

# Checks that public links (resume, site, demos) answer with HTTP 200. Run by hand from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        run: |
          fail=0
          while read -r url; do
            [ -z "$url" ] && continue
            code=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 60 "$url")
            if [ "$code" = "200" ]; then echo "::notice::$code $url"; else echo "::error::$code $url"; fi
            [ "$code" = "200" ] || fail=1
          done < scripts/links.txt
          exit $fail
