[server]
enableStaticServing = true
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "dark"
primaryColor = "#CBFA7C"
backgroundColor = "#101B1B"
secondaryBackgroundColor = "#1B2A26"
textColor = "#F0F7ED"
borderColor = "#263E36"
dataframeBorderColor = "#263E36"
dataframeHeaderBackgroundColor = "#1B2A26"
linkColor = "#CBFA7C"
linkUnderline = false
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "none"
buttonRadius = "none"
baseFontSize = 16
font = "Inter, sans-serif"
headingFont = "Space Grotesk, sans-serif"
headingFontWeights = [700, 700, 700, 600, 600, 600]
metricValueFontWeight = 700
codeFont = "monospace"
greenColor = "#CBFA7C"
orangeColor = "#EF936F"
blueColor = "#8FA2F0"
redColor = "#EF936F"
yellowColor = "#D9C24A"
chartCategoricalColors = ["#CBFA7C", "#EF936F", "#8FA2F0"]
chartSequentialColors = ["#16241F", "#1F3A2C", "#2B5135", "#3A693C", "#4D8243", "#649B4B", "#7FB554", "#9BCF5E", "#B5E66B", "#CBFA7C"]

[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter.woff2"
weight = "300 800"
style = "normal"

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/space-grotesk.woff2"
weight = "300 700"
style = "normal"

[[theme.fontFaces]]
family = "Bodoni Moda"
url = "app/static/bodoni-moda-italic.woff2"
weight = "400 900"
style = "italic"

[theme.sidebar]
backgroundColor = "#142322"
